# A lego_domain override, with the certificate reached through an include. The
# override state machine reads markers emitted around the names they replace, so
# it must not desync when the certificate arrives from a different file.
server {
    listen 443 ssl;
    server_name one.example.org; # lego_domain:*.example.org
    include snippets/_ssl_shared.inc;
}

server {
    listen 443 ssl;
    server_name two.example.org; # lego_domain:*.example.org
    include snippets/_ssl_shared.inc;
}
