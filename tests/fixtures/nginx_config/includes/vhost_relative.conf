# The layout that certificate discovery used to miss entirely: server_name here,
# certificate in the include. Neither file yields both halves on its own.
# The include path is relative, so it resolves against the Nginx prefix.
server {
    listen 443 ssl;
    server_name example.org www.example.org;
    include snippets/_ssl_shared.inc;
}

server {
    listen 443 ssl;
    server_name another.example.org;
    include snippets/_ssl_shared.inc;
}
