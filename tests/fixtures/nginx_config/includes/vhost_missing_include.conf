# An include that matches nothing. Nginx tolerates an empty glob, and so must
# we: a cosmetic config problem must never stop the rest from being parsed.
server {
    listen 443 ssl;
    server_name survives.example.org;
    include snippets/_does_not_exist.inc;
    include nowhere/*.inc;
    ssl_certificate     /etc/letsencrypt/live/survivor-cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/survivor-cert/privkey.pem;
}
