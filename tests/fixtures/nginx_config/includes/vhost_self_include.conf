# A file that includes itself. Nginx would reject this outright; we must simply
# stop at the depth limit rather than recursing until the stack gives out.
server {
    listen 443 ssl;
    server_name loop.example.org;
    ssl_certificate     /etc/letsencrypt/live/loop-cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loop-cert/privkey.pem;
    include vhost_self_include.conf;
}
